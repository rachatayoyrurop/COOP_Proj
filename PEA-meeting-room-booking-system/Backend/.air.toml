root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "env"]
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true

[color]
  build = "yellow"
  main  = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
